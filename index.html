    <script src="https://unpkg.com/lenis@1.3.8/dist/lenis.min.js"></script>

<script>
  const lenis = new Lenis({
    smoothWheel: true,
    lerp: 0.08
  });

  function raf(time) {
    const stage = document.querySelector('.video-stage');
    if (stage) {
      const rect = stage.getBoundingClientRect();
      const distance = Math.abs(rect.top + rect.height / 2 - window.innerHeight / 2);
      const influence = Math.min(1, Math.max(0, 1 - distance / (window.innerHeight * 1.5)));
      lenis.options.lerp = 0.08 + influence * 0.18;
    }

    lenis.raf(time);
    requestAnimationFrame(raf);
  }

  requestAnimationFrame(raf);
</script>
</head>
<body>

    <script>
        const stage = document.querySelector('.video-stage');
        const windowVideo = document.querySelector('.video-window');
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;

        function updateVideoCenter() {
            if (!stage || !windowVideo) return;

            const rect = stage.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const cursorX = window.innerWidth / 2 - centerX;
            const cursorY = window.innerHeight / 2 - centerY;

            const influence = Math.max(0, 1 - Math.abs(rect.top + rect.height / 2 - window.innerHeight / 2) / (window.innerHeight * 1.5));
            targetX = cursorX * (0.12 + influence * 0.18);
            targetY = cursorY * (0.12 + influence * 0.18);
        }

        function animateVideo() {
            currentX += (targetX - currentX) * 0.06;
            currentY += (targetY - currentY) * 0.06;
            windowVideo.style.transform = `translate(calc(-50% + ${currentX.toFixed(2)}px), calc(-50% + ${currentY.toFixed(2)}px))`;
            requestAnimationFrame(animateVideo);
        }

        window.addEventListener('scroll', updateVideoCenter, { passive: true });
        window.addEventListener('mousemove', updateVideoCenter, { passive: true });
        window.addEventListener('resize', updateVideoCenter);
        updateVideoCenter();
        requestAnimationFrame(animateVideo);
    </script>

    <script>
        const navLinks = document.querySelectorAll('.nav-link');

        navLinks.forEach((link) => {
            link.addEventListener('click', (event) => {
                const targetId = link.getAttribute('href');
                if (!targetId || !targetId.startsWith('#')) return;

                const target = document.querySelector(targetId);
                if (!target) return;

                event.preventDefault();
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });

                target.classList.remove('flash-highlight');
                void target.offsetWidth;
                target.classList.add('flash-highlight');

                setTimeout(() => target.classList.remove('flash-highlight'), 200);
            });
        });
    </script>

</body>
